# Pin the Rust toolchain so fmt, clippy, build, and test are reproducible and are
# not silently changed by a new `stable` release (rustfmt/clippy defaults move).
# CI and the nix devShell (flake.nix) both use exactly this toolchain.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
profile = "minimal"
