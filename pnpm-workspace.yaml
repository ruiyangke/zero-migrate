packages:
  - "packages/*"
  # The N-API addon crate is a first-class publishable npm package
  # (`zero-migrate-node`) so `zero-migrate-cli` resolves it as `workspace:*`
  # in the monorepo and pnpm links the built `.node`. It uses `napi build`, not
  # tsup, but is otherwise an ordinary workspace member.
  - "crates/zero-migrate-node"

catalog:
  typescript: "^5.9.3"
  tsx: "^4.23.1"

# pnpm does not run a dependency's install scripts unless it is named here, so
# each entry is a decision about executing code from the dependency tree.
#
# esbuild: true because `tsup` (the build for both JS packages) drives esbuild,
# whose `postinstall` places the platform binary and falls back to fetching it
# over https when the optional `@esbuild/<platform>` package is absent. Denying
# it leaves a package that resolves and cannot run.
#
# Replaces `onlyBuiltDependencies`, which pnpm superseded in 10.26 and drops in
# 11.0. Both keys expressed the same permission; keeping the legacy one would
# have left the decision recorded twice and read from once.
allowBuilds:
  esbuild: true
