name: CI

on:
  push:
  pull_request:

# Cancel superseded in-progress runs on the same ref (a new push to a PR/branch
# supersedes the older one). Keeps the queue short without dropping main history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail fast on any Rust warning in build/test compilation (clippy has its own
  # `-D warnings` gate below; this covers rustc warnings in the non-clippy steps).
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # Rust: fmt + clippy + build + the full test suite against LIVE Postgres and
  # MySQL service containers, so the env-gated live-DB tests actually RUN in CI
  # (rather than skipping as they do in a DB-free checkout).
  # ---------------------------------------------------------------------------
  rust:
    name: rust (fmt/clippy/build/test + PG & MySQL)
    runs-on: ubuntu-latest

    services:
      # Live Postgres for the in-crate `pg_*` tests (gated on ZERO_MIGRATE_TEST_PG_URL).
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: zero_migrate
          POSTGRES_DB: zero_migrate_test
        ports:
          - 5432:5432
        # Wait for the server to accept connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Live MySQL for the env-gated live-MySQL path (ZERO_MIGRATE_MYSQL_URL). No
      # in-crate Rust test reads it today (the live-MySQL e2e lives in the engine
      # host suite), but it is exported here per the pipeline contract so any Rust
      # live-MySQL test added later runs without a workflow change.
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: zero_migrate
          MYSQL_DATABASE: zero_migrate_test
        ports:
          - 3306:3306
        # `mysqladmin ping` returns success once the server answers the handshake.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzero_migrate --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The env-gated live-DB tests read these; set here (job scope) so every step
      # in this job sees them. `127.0.0.1` (not `localhost`) forces TCP — the mapped
      # service ports are only reachable over TCP from the runner host.
      ZERO_MIGRATE_TEST_PG_URL: postgres://postgres:zero_migrate@127.0.0.1:5432/zero_migrate_test
      ZERO_MIGRATE_MYSQL_URL: mysql://root:zero_migrate@127.0.0.1:3306/zero_migrate_test

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust (+ clippy, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # `--workspace --all-targets` DOES include zero-migrate-node: `cargo clippy`
      # only compiles it (the napi_build link args resolve at `.node` load time),
      # so clippy over the whole workspace is safe and covers all four crates.
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build (workspace)
        run: cargo build --workspace

      # The napi cdylib is kept out of the default build/test flow (default-members),
      # so build it explicitly to prove the addon crate compiles.
      - name: cargo build (napi cdylib)
        run: cargo build -p zero-migrate-node

      # Full workspace test against the live PG service (the pg_* tests read
      # ZERO_MIGRATE_TEST_PG_URL and now RUN instead of skipping). zero-migrate-node
      # is excluded here because its default features link against the Node ABI
      # (`napi build` supplies the allow-undefined args); a bare `cargo test` of it
      # link-fails — it is tested separately with --no-default-features below.
      - name: cargo test (workspace, live PG)
        run: cargo test --workspace --exclude zero-migrate-node

      # The addon crate's pure-Rust core + marshal/session bridge + mock-apply
      # integration test, WITHOUT the Node ABI (default features link-fail off a
      # `napi build`); --no-default-features drops the `#[napi]` entrypoints.
      - name: cargo test (zero-migrate-node, no napi ABI)
        run: cargo test -p zero-migrate-node --no-default-features

  # ---------------------------------------------------------------------------
  # Node: the JS SDKs — build both packages, typecheck, and run the DB-free test
  # suites (authoring DSL tests + the engine doc-example gate).
  # ---------------------------------------------------------------------------
  node:
    name: node (SDK build/check/test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm install
        run: pnpm install

      - name: pnpm -w build
        run: pnpm -w build

      - name: zero-migrate check (tsc x2)
        run: pnpm --filter zero-migrate check

      - name: zero-migrate test
        run: pnpm --filter zero-migrate test

      - name: zero-migrate-engine typecheck
        run: pnpm --filter zero-migrate-engine typecheck

      - name: zero-migrate-engine test:docs
        run: pnpm --filter zero-migrate-engine test:docs

  # ---------------------------------------------------------------------------
  # napi: build the shipped release `.node` addon to prove it links + loads. A
  # single linux-x64 target is sufficient in CI (the full cross-target matrix is a
  # release concern). Uses the release profile (workspace-root lto + strip).
  # ---------------------------------------------------------------------------
  napi:
    name: napi (release .node build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-napi-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-napi-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install

      # `napi build --platform --release` (the crate's `build` script) emits the
      # loadable index.node for the runner's linux-x64 triple, proving the shipped
      # addon compiles + links under the release profile.
      - name: build release addon
        run: pnpm --filter zero-migrate-node build
