name: CI

on:
  push:
  pull_request:

# Cancel superseded in-progress runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Run every step inside the Nix dev shell so the pinned toolchain
    # (rustc/clippy/rustfmt 1.97.1, the C/libclang/bindgen setup for pg_query and
    # rusqlite, Node 22, pnpm) all come from flake.nix. Each job installs Nix first
    # (nix-installer-action), then every run step uses the flake shell. One
    # environment for CI and local dev; a moving `stable` can never change CI.
    shell: nix develop --command bash {0}

jobs:
  # ---------------------------------------------------------------------------
  # rust: fmt + clippy + build + the full workspace test suite against LIVE
  # Postgres AND MySQL service containers (the env-gated pg_* and mysql suites
  # actually RUN in CI).
  #
  # MySQL joined this job because the Rust engine had NO live MySQL coverage of any
  # kind. Measured before adding it: `ZERO_MIGRATE_MYSQL_URL` appeared in 52 files
  # under `packages/` and in ONE under `crates/`, and that one was
  # `src/apply/backend/mysql/mod.rs` - source, not a test. So MySQL was exercised at
  # RENDER level (unit tests over emitted SQL) and at CLI/HOST level (the
  # TypeScript `host` job below), and nowhere in between. The first Rust test to ask
  # a live MySQL server what the engine actually did found two permanent-drift
  # defects and one hole in a load gate; see `crates/zero-migrate/tests/
  # fold_roundtrip_mysql.rs` and the review log.
  #
  # The image and credential pattern are copied from the `host` job below rather
  # than invented: one `mysql:8`, one `MYSQL_ROOT_PASSWORD: zero_migrate`, one
  # `mysqladmin ping` health check. Two patterns for the same service would drift.
  # ---------------------------------------------------------------------------
  rust:
    name: rust (fmt/clippy/build/test + live PG + MySQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zero_migrate
          POSTGRES_DB: zero_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: zero_migrate
          MYSQL_DATABASE: zero_migrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzero_migrate --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RUSTFLAGS: "-D warnings"
      ZERO_MIGRATE_TEST_PG_URL: postgres://postgres:zero_migrate@127.0.0.1:5432/zero_migrate_test
      ZERO_MIGRATE_MYSQL_URL: mysql://root:zero_migrate@127.0.0.1:3306/zero_migrate_test
      # This job exists to run the live-database suites, so a skipped one is a
      # broken service rather than a contributor without a database. Fail instead
      # of reporting the same pass count a real run reports. This now covers the
      # MySQL DSN too: `skip_if_no_mysql!` routes through the same
      # `announce_live_db_skip`, so deleting the DSN line above turns the new MySQL
      # suites red instead of letting them quietly skip.
      ZERO_MIGRATE_REQUIRE_LIVE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build (workspace)
        run: cargo build --workspace
      # The napi cdylib is kept out of default-members; build it explicitly.
      - name: cargo build (napi cdylib)
        run: cargo build -p zero-migrate-node
      - name: cargo test (workspace, live PG)
        run: cargo test --workspace --exclude zero-migrate-node
      # The addon crate WITHOUT the Node ABI (default features link-fail off a napi build).
      - name: cargo test (zero-migrate-node, no napi ABI)
        run: cargo test -p zero-migrate-node --no-default-features
      # Doc links rot silently: a reference that cannot be resolved still reads as
      # authoritative, and several had come to name items that no longer exist.
      #
      # --document-private-items because without it rustdoc never reads a private
      # item's doc comment, so a broken link there cannot reach this gate at all.
      # That blind spot was load-bearing rather than theoretical: 0 broken links
      # inside the gate's own configuration and 27 outside it, and among the 27 was
      # a link an earlier commit message had claimed to fix. Nothing is published
      # from these crates - the release workflow ships the napi addon and the npm
      # packages - so this widens what the gate SEES without changing any artifact.
      # `-D warnings` rather than the single broken-links lint, because the gate
      # exited 0 while printing 43 warnings, and a gate whose output is ignored
      # teaches contributors to ignore its output. The 43 were all
      # `redundant_explicit_links`; they are fixed in the same commit, so this
      # flag starts from zero rather than deferring a cleanup.
      #
      # Seven rustdoc lints are default-`warn` and so become load-bearing here:
      # broken_intra_doc_links, private_intra_doc_links, bare_urls,
      # invalid_html_tags, invalid_rust_codeblocks, invalid_codeblock_attributes,
      # redundant_explicit_links. `unescaped_backticks` is default-`allow` and is
      # NOT enabled by this flag - naming it would need `-W` and a fresh count.
      - name: cargo doc (no rustdoc warnings)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ---------------------------------------------------------------------------
  # scaling: the wall-clock COMPLEXITY guards (f664/f665), alone on a runner.
  #
  # These assert that doubling N does not quadruple the work - a RATIO, not a
  # budget - and they are the one thing in this repository whose verdict depends on
  # what else the machine is doing. They produced false failures repeatedly on a
  # loaded developer box: 3.6x/3.6x/3.8x at load average 26 and 3.5x/3.6x/3.9x at
  # load average 30, a different arm each time, all green on an idle re-run.
  #
  # NO `services:` block, deliberately. A service container is a second process tree
  # competing for the same CPU, and a Postgres or MySQL container that this job never
  # queries would still be initializing its data directory while the first ratio is
  # being measured. It has no database work to do, so it gets no databases.
  #
  # This job is also why the `rust` job above can grow a live MySQL service without
  # putting the flake next to it. A conformance matrix multiplies database load on
  # these runners, and a known flake sitting beside a new suite gets the new suite
  # blamed for it.
  #
  # The guards are `#[ignore]`d in source, so `cargo test --workspace` in the `rust`
  # job compiles and lints them (clippy runs `--all-targets`) but does not TIME them,
  # and `-- --ignored` here is the only place they are timed. The threshold was NOT
  # relaxed to achieve this, and CPU time was measured against wall clock and
  # rejected as an instrument; both arguments live in the header of
  # `crates/zero-migrate/tests/authoring_surface/f664_scaling.rs`.
  # ---------------------------------------------------------------------------
  scaling:
    name: scaling (complexity guards, idle machine, no services)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-scaling-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-scaling-${{ runner.os }}-

      # `--test-threads=1` so the guards' arms never time each other: these measure
      # the machine, and libtest's default parallelism would have them competing for
      # the cores whose availability is the whole measurement.
      #
      # `tee` plus the check below because `--ignored` combined with a filter that
      # matched nothing exits 0 while running zero tests, which is exactly the
      # failure this job exists to prevent - a guard that silently stops guarding.
      # `(^| )0 passed` rather than a plain `0 passed` so a legitimate "10 passed"
      # does not trip it.
      #
      # THE TARGET IS `authoring_surface`, NOT `f664_scaling`/`f665_scaling`. Those
      # were once their own test binaries; consolidating the tests into themed
      # subdirectories made them MODULES inside `tests/authoring_surface/`, and no
      # `[[test]]` targets are declared, so cargo auto-discovers one binary per
      # `tests/*/main.rs`. The old invocation therefore died with
      # `error: no test target named f664_scaling` (exit 101) and this job had not
      # timed a guard since the move.
      #
      # Worth noting WHY the careful check below did not catch it: it guards against
      # the filter matching nothing, which is a run that succeeds while measuring
      # nothing. A target that does not exist is a different failure - cargo exits
      # non-zero before any test runs, so `set -o pipefail` is what reddens the step,
      # and `scaling.log` never gets a "0 passed" line for the grep to find. A guard
      # aimed at one silent failure was defeated by a loud one it did not cover.
      #
      # The ignored set in `authoring_surface` is EXACTLY these five guards
      # (`--list --ignored` confirms: four `f664_scaling::`, one `f665_scaling::`),
      # so naming the binary runs precisely what naming the two old ones did.
      - name: cargo test (complexity guards only)
        run: |
          set -o pipefail
          cargo test -p zero-migrate --test authoring_surface \
            -- --ignored --test-threads=1 2>&1 | tee scaling.log
      - name: the guards actually ran
        run: |
          if grep -qE '(^| )0 passed' scaling.log; then
            echo "a scaling test binary reported 0 passed: the --ignored filter ran nothing" >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # node: build the JS packages, typecheck, and run the DB-free test suites.
  # node + pnpm come from the flake.
  # ---------------------------------------------------------------------------
  node:
    name: node (packages build/check/test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm -w build
        run: pnpm -w build
      # `dist/embedded-recorder.js` is tsup output, but it is the ONE file under
      # `packages/zero-migrate/dist/` that is COMMITTED - `.gitignore` ignores the
      # directory's contents and then force-tracks this single file. A downstream
      # consumer that loads this tree by absolute path reads the checked-in bytes,
      # not anything a build produced, and nothing compared the two until this
      # step. The build above just rewrote the file; a non-empty diff means the
      # committed copy is stale and must be regenerated in the commit.
      #
      # Safe to gate because the bundle is byte-deterministic for a fixed source:
      # two forced rebuilds of an unchanged tree emit identical bytes. Adding any
      # wall clock, absolute path, or git state to the tsup output would make this
      # step permanently red.
      #
      # Scope: this ONE file, byte for byte. It does NOT check that the recorder
      # behaves correctly - `zero-migrate test` below owns that, by re-authoring
      # the same migrations through both `src/ops.ts` and this artifact and
      # asserting the recorded ops match. That parity catches drift that changes
      # recorded output; this step additionally catches drift that does not, such
      # as a bundling, ordering, or comment-only change. It does NOT cover
      # `dist/index.js`, `dist/internal/recorder.js`, or the `.map` sidecars, and
      # nothing else needs to: `.gitignore` excludes all of `packages/zero-migrate/
      # dist/*` except this one file, so there is no committed copy of them that
      # could go stale. `embedded-recorder.js` is the sole tracked artifact in that
      # directory, which is exactly why it is the sole thing gated here.
      #
      # Runs from the repo root, as every step in this workflow does (no
      # `working-directory` is set). A `git diff` pathspec issued from a
      # subdirectory can fail to resolve and report a false pass, so this step
      # must not be moved under one.
      - name: embedded-recorder.js matches tsup build (no committed drift)
        run: git diff --exit-code -- packages/zero-migrate/dist/embedded-recorder.js
      - name: zero-migrate check (tsc x2)
        run: pnpm --filter zero-migrate --fail-if-no-match check
      - name: zero-migrate test
        run: pnpm --filter zero-migrate --fail-if-no-match test
      - name: zero-migrate-cli typecheck
        run: pnpm --filter zero-migrate-cli --fail-if-no-match typecheck
      - name: zero-migrate-cli test:docs
        run: pnpm --filter zero-migrate-cli --fail-if-no-match test:docs

  # ---------------------------------------------------------------------------
  # napi: build the shipped release `.node` addon, run the addon's own JS gates
  # against it, then compile its generated schema artifact against the real
  # authoring package (a single linux-x64 target; the full cross-target matrix is
  # a release concern). A `cargo test -p zero-migrate-node` cannot stand in for the
  # JS gates: linking a test binary against the Node ABI fails outside a `.node`
  # (undefined `napi_*` symbols), which is why the Rust side is tested with
  # `--no-default-features` in the rust job.
  # ---------------------------------------------------------------------------
  napi:
    name: napi (release .node build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-napi-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-napi-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: build zero-migrate authoring package
        run: pnpm --filter zero-migrate --fail-if-no-match build
      - name: build release addon
        run: pnpm --filter zero-migrate-node --fail-if-no-match build
      # `index.d.ts` is napi codegen output, but it is COMMITTED and shipped in the
      # package `files` - so a consumer's types come from the checked-in copy, not
      # from the build. Nothing compared the two until this step, and the file had
      # already drifted. The build above just rewrote it; a non-empty diff means the
      # committed copy is stale and must be regenerated in the commit.
      #
      # This is safe to gate because the file carries only TYPES. The one build
      # input that varies per tree, the `buildInfo()` source digest, is folded into
      # the compiled `.node` and read at runtime - its value never reaches
      # `index.d.ts`, so an unchanged tree regenerates the file byte-identically.
      # Adding any wall clock, path, or git state to the generated output would make
      # this step permanently red.
      #
      # `index.js` is gated too, and for a sharper reason than `index.d.ts`. It is the
      # native-binding LOADER, it ships in the same `files` list, and every consumer
      # that vendors this crate regenerates it from their own build - so whatever
      # template produced it decides how the addon resolves at runtime for everyone.
      # It went ungated while the generator was a caret range, because the resolved
      # version was a function of install timing rather than of this repository:
      # `^3.7.3` resolved to 3.7.3 here and 3.8.2 in a consumer workspace, whose build
      # emitted a materially different loader. The specifier is now exact, so this
      # step compares the committed copy against one known generator.
      #
      # Measured before adding it, rather than assumed: a full `pnpm install
      # --frozen-lockfile` plus `napi build --platform --release` under the pinned
      # 3.7.3 leaves `index.js` byte-identical (sha256 unchanged) and the whole tree
      # clean. If this step ever goes red, the question to ask first is whether the
      # pin moved.
      - name: index.d.ts and index.js match napi codegen (no committed drift)
        run: git diff --exit-code -- crates/zero-migrate-node/index.d.ts crates/zero-migrate-node/index.js
      # The addon's own JS gates: the only tests that drive the real `.node` over a
      # canned host driver (build identity, mock apply, plan-aware status, artifact
      # generation). Four short node processes against the addon this job just
      # built, so they add ~2s of wall clock and no extra build.
      - name: addon JS gates (real .node, canned host driver)
        run: pnpm --filter zero-migrate-node --fail-if-no-match test
      - name: typecheck generated schema artifact
        run: pnpm --filter zero-migrate-node --fail-if-no-match test:codegen

  # ---------------------------------------------------------------------------
  # host: the CLI host e2e suite (test:host), which drives the REAL napi addon
  # over the pg + mysql2 driver adapters against LIVE Postgres AND MySQL.
  # ---------------------------------------------------------------------------
  host:
    name: host (cli e2e - live PG + MySQL over the napi addon)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zero_migrate
          POSTGRES_DB: zero_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: zero_migrate
          MYSQL_DATABASE: zero_migrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzero_migrate --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ZERO_MIGRATE_TEST_PG_URL: postgres://postgres:zero_migrate@127.0.0.1:5432/zero_migrate_test
      ZERO_MIGRATE_MYSQL_URL: mysql://root:zero_migrate@127.0.0.1:3306/zero_migrate_test
      # This job exists to drive the suites against live databases. The DSN above
      # already turns a failed connect into a failed job; this catches the other way
      # in, where the DSN line is deleted and every gated suite quietly skips.
      ZERO_MIGRATE_REQUIRE_LIVE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-host-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # The host tests load the addon resolved through the zero-migrate-node
      # workspace package; build it first.
      - name: build release addon
        run: pnpm --filter zero-migrate-node --fail-if-no-match build
      - name: pnpm -w build
        run: pnpm -w build
      # `test:host:leak` RUNS `test:host` - it snapshots both servers, spawns the
      # suite verbatim from the `test:host` script, and snapshots again - so this is
      # one suite run, not two, and its TAP output is the same. What it adds is the
      # verdict the disposable service containers here can never give: whether the
      # suite drops everything it created. A leak is invisible on a container that is
      # thrown away at the end of the job and expensive on the shared development
      # servers, where one file leaking one meta database per run had reached 218.
      - name: zero-migrate-cli test:host (live PG + MySQL, leak-gated)
        run: pnpm --filter zero-migrate-cli --fail-if-no-match test:host:leak
