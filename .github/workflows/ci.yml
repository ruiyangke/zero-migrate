name: CI

on:
  push:
  pull_request:

# Cancel superseded in-progress runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Run every step inside the Nix dev shell so the pinned toolchain
    # (rustc/clippy/rustfmt 1.97.1, the C/libclang/bindgen setup for pg_query and
    # rusqlite, Node 22, pnpm) all come from flake.nix. Each job installs Nix first
    # (nix-installer-action), then every run step uses the flake shell. One
    # environment for CI and local dev; a moving `stable` can never change CI.
    shell: nix develop --command bash {0}

jobs:
  # ---------------------------------------------------------------------------
  # rust: fmt + clippy + build + the full workspace test suite against a LIVE
  # Postgres service container (the env-gated pg_* tests actually RUN in CI).
  # ---------------------------------------------------------------------------
  rust:
    name: rust (fmt/clippy/build/test + live PG)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zero_migrate
          POSTGRES_DB: zero_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RUSTFLAGS: "-D warnings"
      ZERO_MIGRATE_TEST_PG_URL: postgres://postgres:zero_migrate@127.0.0.1:5432/zero_migrate_test
      # This job exists to run the live-PostgreSQL suites, so a skipped one is a
      # broken service rather than a contributor without a database. Fail instead
      # of reporting the same pass count a real run reports.
      ZERO_MIGRATE_REQUIRE_LIVE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build (workspace)
        run: cargo build --workspace
      # The napi cdylib is kept out of default-members; build it explicitly.
      - name: cargo build (napi cdylib)
        run: cargo build -p zero-migrate-node
      - name: cargo test (workspace, live PG)
        run: cargo test --workspace --exclude zero-migrate-node
      # The addon crate WITHOUT the Node ABI (default features link-fail off a napi build).
      - name: cargo test (zero-migrate-node, no napi ABI)
        run: cargo test -p zero-migrate-node --no-default-features
      # Doc links rot silently: a reference that cannot be resolved still reads as
      # authoritative, and several had come to name items that no longer exist.
      #
      # --document-private-items because without it rustdoc never reads a private
      # item's doc comment, so a broken link there cannot reach this gate at all.
      # That blind spot was load-bearing rather than theoretical: 0 broken links
      # inside the gate's own configuration and 27 outside it, and among the 27 was
      # a link an earlier commit message had claimed to fix. Nothing is published
      # from these crates - the release workflow ships the napi addon and the npm
      # packages - so this widens what the gate SEES without changing any artifact.
      - name: cargo doc (no broken intra-doc links)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken_intra_doc_links"

  # ---------------------------------------------------------------------------
  # node: build the JS packages, typecheck, and run the DB-free test suites.
  # node + pnpm come from the flake.
  # ---------------------------------------------------------------------------
  node:
    name: node (packages build/check/test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: pnpm -w build
        run: pnpm -w build
      # `dist/embedded-recorder.js` is tsup output, but it is the ONE file under
      # `packages/zero-migrate/dist/` that is COMMITTED - `.gitignore` ignores the
      # directory's contents and then force-tracks this single file. A downstream
      # consumer that loads this tree by absolute path reads the checked-in bytes,
      # not anything a build produced, and nothing compared the two until this
      # step. The build above just rewrote the file; a non-empty diff means the
      # committed copy is stale and must be regenerated in the commit.
      #
      # Safe to gate because the bundle is byte-deterministic for a fixed source:
      # two forced rebuilds of an unchanged tree emit identical bytes. Adding any
      # wall clock, absolute path, or git state to the tsup output would make this
      # step permanently red.
      #
      # Scope: this ONE file, byte for byte. It does NOT check that the recorder
      # behaves correctly - `zero-migrate test` below owns that, by re-authoring
      # the same migrations through both `src/ops.ts` and this artifact and
      # asserting the recorded ops match. That parity catches drift that changes
      # recorded output; this step additionally catches drift that does not, such
      # as a bundling, ordering, or comment-only change. It does NOT cover
      # `dist/index.js`, `dist/internal/recorder.js`, or the `.map` sidecars, and
      # nothing else needs to: `.gitignore` excludes all of `packages/zero-migrate/
      # dist/*` except this one file, so there is no committed copy of them that
      # could go stale. `embedded-recorder.js` is the sole tracked artifact in that
      # directory, which is exactly why it is the sole thing gated here.
      #
      # Runs from the repo root, as every step in this workflow does (no
      # `working-directory` is set). A `git diff` pathspec issued from a
      # subdirectory can fail to resolve and report a false pass, so this step
      # must not be moved under one.
      - name: embedded-recorder.js matches tsup build (no committed drift)
        run: git diff --exit-code -- packages/zero-migrate/dist/embedded-recorder.js
      - name: zero-migrate check (tsc x2)
        run: pnpm --filter zero-migrate --fail-if-no-match check
      - name: zero-migrate test
        run: pnpm --filter zero-migrate --fail-if-no-match test
      - name: zero-migrate-cli typecheck
        run: pnpm --filter zero-migrate-cli --fail-if-no-match typecheck
      - name: zero-migrate-cli test:docs
        run: pnpm --filter zero-migrate-cli --fail-if-no-match test:docs

  # ---------------------------------------------------------------------------
  # napi: build the shipped release `.node` addon, run the addon's own JS gates
  # against it, then compile its generated schema artifact against the real
  # authoring package (a single linux-x64 target; the full cross-target matrix is
  # a release concern). A `cargo test -p zero-migrate-node` cannot stand in for the
  # JS gates: linking a test binary against the Node ABI fails outside a `.node`
  # (undefined `napi_*` symbols), which is why the Rust side is tested with
  # `--no-default-features` in the rust job.
  # ---------------------------------------------------------------------------
  napi:
    name: napi (release .node build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-napi-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-napi-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: build zero-migrate authoring package
        run: pnpm --filter zero-migrate --fail-if-no-match build
      - name: build release addon
        run: pnpm --filter zero-migrate-node --fail-if-no-match build
      # `index.d.ts` is napi codegen output, but it is COMMITTED and shipped in the
      # package `files` - so a consumer's types come from the checked-in copy, not
      # from the build. Nothing compared the two until this step, and the file had
      # already drifted. The build above just rewrote it; a non-empty diff means the
      # committed copy is stale and must be regenerated in the commit.
      #
      # This is safe to gate because the file carries only TYPES. The one build
      # input that varies per tree, the `buildInfo()` source digest, is folded into
      # the compiled `.node` and read at runtime - its value never reaches
      # `index.d.ts`, so an unchanged tree regenerates the file byte-identically.
      # Adding any wall clock, path, or git state to the generated output would make
      # this step permanently red.
      #
      # Scope: `index.d.ts` only. `index.js` is regenerated by the same command and
      # is not gated here.
      - name: index.d.ts matches napi codegen (no committed drift)
        run: git diff --exit-code -- crates/zero-migrate-node/index.d.ts
      # The addon's own JS gates: the only tests that drive the real `.node` over a
      # canned host driver (build identity, mock apply, plan-aware status, artifact
      # generation). Four short node processes against the addon this job just
      # built, so they add ~2s of wall clock and no extra build.
      - name: addon JS gates (real .node, canned host driver)
        run: pnpm --filter zero-migrate-node --fail-if-no-match test
      - name: typecheck generated schema artifact
        run: pnpm --filter zero-migrate-node --fail-if-no-match test:codegen

  # ---------------------------------------------------------------------------
  # host: the CLI host e2e suite (test:host), which drives the REAL napi addon
  # over the pg + mysql2 driver adapters against LIVE Postgres AND MySQL.
  # ---------------------------------------------------------------------------
  host:
    name: host (cli e2e - live PG + MySQL over the napi addon)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: zero_migrate
          POSTGRES_DB: zero_migrate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: zero_migrate
          MYSQL_DATABASE: zero_migrate_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pzero_migrate --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      ZERO_MIGRATE_TEST_PG_URL: postgres://postgres:zero_migrate@127.0.0.1:5432/zero_migrate_test
      ZERO_MIGRATE_MYSQL_URL: mysql://root:zero_migrate@127.0.0.1:3306/zero_migrate_test
      # This job exists to drive the suites against live databases. The DSN above
      # already turns a failed connect into a failed job; this catches the other way
      # in, where the DSN line is deleted and every gated suite quietly skips.
      ZERO_MIGRATE_REQUIRE_LIVE_DB: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-host-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-

      - name: pnpm install
        run: pnpm install --frozen-lockfile
      # The host tests load the addon resolved through the zero-migrate-node
      # workspace package; build it first.
      - name: build release addon
        run: pnpm --filter zero-migrate-node --fail-if-no-match build
      - name: pnpm -w build
        run: pnpm -w build
      - name: zero-migrate-cli test:host (live PG + MySQL)
        run: pnpm --filter zero-migrate-cli --fail-if-no-match test:host
