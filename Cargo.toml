[workspace]
members = ["crates/*"]
resolver = "3"
# The N-API addon (`zero-migrate-node`) is a full workspace member — it inherits
# the shared `[workspace.package]` / `[workspace.dependencies]` / `[workspace.lints]`
# and resolves against the single root lockfile. It is a `cdylib` leaf: `cargo build`
# compiles it fine (napi_build only emits allow-undefined link args for the Node ABI,
# resolved at `.node` load time), but it is kept OUT of the default build/test flow
# via `default-members` below so a bare `cargo build`/`cargo test` never pulls the
# napi toolchain path. Build the loadable `.node` separately via `napi build`.
default-members = [
    "crates/zero-migrate",
    "crates/zero-migrate-guard",
    "crates/zero-migrate-ir",
    "crates/zero-migrate-policy",
]

# ---------------------------------------------------------------------------
# Shared package metadata
# ---------------------------------------------------------------------------

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# ---------------------------------------------------------------------------
# Shared dependency versions (single source of truth)
# ---------------------------------------------------------------------------

[workspace.dependencies]
# Async / I/O — compio (io_uring), NOT tokio. Used ONLY as a dev-dependency: the
# async-apply test harness (`#[compio::test]`) drives the seam-generic apply path.
# No shipped engine code links compio; the engine is compio-free.
compio = { version = "0.18", features = ["io", "net", "runtime", "macros", "time"] }
# Executor-agnostic future combinators (`FutureExt::catch_unwind`,
# `futures::executor::block_on`). NOT an async runtime.
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }

# CLI argument parsing (sync — no async runtime). `env` backs the
# `--database-url` / `DATABASE_URL` fallback.
clap = { version = "4", features = ["derive", "env"] }

# JSON Schema generation for the `op.*` migration IR contract (ir-envelope.schema.json).
schemars = "1"

# Crypto / hashing
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# IDs — UUIDv7-shaped migration ids, base62-encoded.
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Error handling
thiserror = "2"

# Utilities
hex = "0.4"

# Logging / tracing facade (no runtime, no crypto).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "env-filter", "fmt", "ansi", "json", "tracing-log"] }

# Bounded MPMC queue — the migration actor's single-writer queue.
flume = { version = "0.11", default-features = false, features = ["async"] }

# Auto-cleaning temp file / directory helper (dev-dep: per-test temp SQLite files).
tempfile = "3"

# SQLite migration backend — bundled amalgamation (3.51.3). `load_extension` is
# used only to DISABLE extension loading at open (the migration conn is CDC-free +
# extension-free to creator SQL).
rusqlite = { version = "0.39", features = ["bundled", "load_extension", "hooks"] }

# Internal crates
zero-migrate-ir = { path = "crates/zero-migrate-ir" }
zero-migrate-guard = { path = "crates/zero-migrate-guard" }
zero-migrate-policy = { path = "crates/zero-migrate-policy" }

# ---------------------------------------------------------------------------
# Shared lints
# ---------------------------------------------------------------------------

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# ---------------------------------------------------------------------------
# Curated allows for the opinionated / stylistic pedantic + nursery lints (and a
# few `clippy::all` style lints) that fire in volume across the workspace and are
# noise-not-bugs here. Each carries its rationale below. They live in the shared
# workspace lints table (priority 0 > the group's -1, and applied to every target
# incl. integration tests) so the allow set is uniform across all four crates.
#
# The correctness/perf lints stay ENABLED and are fixed in code — e.g.
# `redundant_clone`, `or_fun_call`, `useless_conversion`, `needless_borrow`,
# `large_enum_variant`, `redundant_static_lifetimes`, `manual_div_ceil`,
# `iter_kv_map`, `derivable_impls`.
# ---------------------------------------------------------------------------

# Doc-prose style: backtick-every-identifier + paragraph/list-wrapping opinions on
# hand-written narrative module docs — rendering taste, not code correctness.
doc_markdown = "allow"
doc_lazy_continuation = "allow"
too_long_first_doc_paragraph = "allow"
doc_link_code = "allow"
# Missing-doc-section mandates: the surface is documented narratively, not with
# mandatory `# Errors` / `# Panics` / `#[must_use]` boilerplate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Single-thread engine: the driver/apply futures are `!Send` by construction
# (compio-free, single-isolate host), so flagging them as non-`Send` is noise.
future_not_send = "allow"
# Stylistic structure / idiom opinions with no behavioural weight here.
use_self = "allow"
# The suggested "larger unit" rewrite (`from_mins`/`from_hours`) is still unstable,
# so it is not applicable on stable; the explicit seconds read fine.
duration_suboptimal_units = "allow"
missing_const_for_fn = "allow"
match_same_arms = "allow"
redundant_pub_crate = "allow"
redundant_closure_for_method_calls = "allow"
option_if_let_else = "allow"
default_trait_access = "allow"
ref_option = "allow"
map_unwrap_or = "allow"
items_after_statements = "allow"
option_option = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
trivially_copy_pass_by_ref = "allow"
single_match_else = "allow"
if_not_else = "allow"
struct_excessive_bools = "allow"
unnecessary_wraps = "allow"
iter_on_single_items = "allow"
needless_raw_string_hashes = "allow"
inconsistent_struct_constructor = "allow"
ignored_unit_patterns = "allow"
used_underscore_binding = "allow"
implicit_clone = "allow"
manual_string_new = "allow"
significant_drop_tightening = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
module_name_repetitions = "allow"
format_push_string = "allow"
assigning_clones = "allow"
needless_collect = "allow"
derive_partial_eq_without_eq = "allow"
debug_assert_with_mut_call = "allow"
# The napi-boundary + host-registry entrypoints take concrete
# `HashMap<String, String>` (the JS-object marshalling type); they cannot be made
# generic over the hasher `S`, so `implicit_hasher` does not apply.
implicit_hasher = "allow"
# Size / length opinions on internal plumbing — intentional shapes.
too_many_lines = "allow"
too_many_arguments = "allow"
# `IrLowerError` is a shared by-value error returned across the whole render/apply
# surface; boxing it to satisfy a marginal 128-byte threshold would ripple through
# dozens of signatures for no behavioural gain.
result_large_err = "allow"
# Numeric casts that are intentional / range-bounded in the IR + rendering paths.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"

# ---------------------------------------------------------------------------
# Release profile — LTO + symbol strip for the shipped `zero-migrate-node` `.node`
# artifact. Profile tables in a non-root workspace member are ignored by cargo, so
# these must live at the workspace root (they apply to every member's release build).
# ---------------------------------------------------------------------------

[profile.release]
lto = true
strip = "symbols"
