# REFERENCE binary for the Phase-D differential oracle (design §7 Phase D / §F.5).
# This is NOT part of the shipped addon — it is a dev-only reference apply of an
# `.ir.json` on PG over the driver-neutral seam, so the oracle can assert the host
# apply's journal == a reference apply's journal (Oracle 1), not host==self.
#
# Standalone workspace (own [workspace] table) so it does not perturb the addon's
# excluded-leaf feature isolation or the platform lockfile.
[workspace]

[package]
name = "migrate-native-ref"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "migrate-native-ref"
path = "src/main.rs"

[dependencies]
# The engine core + the standalone `.ir.json` PG apply entry. `standalone-cli`
# exposes `apply_standalone` (the public `.ir.json` PG apply entry) over the
# driver-neutral seam; kept OUT of the shipped addon as a dev-only oracle fixture.
zero-migrate = { path = "../../../../../crates/zero-migrate", default-features = false, features = ["host-pg", "standalone-cli"] }
compio = { version = "0.18", features = ["io", "net", "runtime", "macros", "time"] }
serde_json = "1"
